name: Daily Decline Ranking to LINE

on:
  schedule:
    # UTC 8:00 = 日本時間 17:00(平日のみ)。市場終了後の確定終値ベースで計算する運用に変更
    - cron: "0 8 * * 1-5"
  workflow_dispatch: {}  # 手動実行用(動作確認に便利)

permissions:
  contents: write  # チャート画像・CSVをリポジトリにcommit&pushするために必要

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build model if not exists
        run: |
          if [ ! -f "./output/reversal_model.joblib" ]; then
            python reversal_predictor.py
          fi

      - name: Generate today's ranking, charts, and Flex message
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python daily_decline_ranking.py

      - name: Commit and push charts/output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p charts output
          git add charts/ output/
          git diff --cached --quiet || git commit -m "Update daily decline ranking $(date +'%Y-%m-%d')"
          git push

      - name: Send message to LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: python send_line.py
